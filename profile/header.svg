<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <style>
      .text-code { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .title { font-weight: 800; font-size: 32px; fill: #ff4d4d; filter: url(#glow-red); }
      .prompt { font-size: 15px; fill: #7f8ea3; }
      .cmd { font-size: 15px; fill: #2ea043; filter: url(#glow-green); font-weight: 600; }
      .tagline { font-size: 16px; fill: #e6edf3; font-weight: 500; }
      .lore-label { font-size: 12px; fill: #8b949e; letter-spacing: 1px; }
      .lore-flow { font-size: 14px; fill: #f0883e; font-weight: 600; }
      .cursor { fill: #2ea043; animation: blink 1s infinite; }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="800" height="240" rx="10" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Terminal Header Bar -->
  <rect width="800" height="38" rx="10" fill="#161b22"/>
  <rect y="28" width="800" height="10" fill="#161b22"/>
  <line x1="0" y1="38" x2="800" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="400" y="23" text-anchor="middle" class="text-code" font-size="12" fill="#8b949e">crab-pack — bash — 80x24</text>

  <!-- Terminal Content -->
  <text x="25" y="78" class="text-code"><tspan class="title">🦀 CRAB PACK</tspan><tspan class="prompt" font-size="14" dx="16">// Creative Lab Pack</tspan></text>

  <text x="25" y="112" class="text-code"><tspan class="prompt">crab@dev-machine:~$</tspan><tspan class="cmd" dx="10">git commit -m "Seriously Creative, Pure Crap."</tspan></text>

  <text x="25" y="148" class="text-code tagline">"Seriously Creative, Pure Crap."</text>

  <line x1="25" y1="170" x2="775" y2="170" stroke="#21262d" stroke-width="1.5" stroke-dasharray="6,6"/>

  <text x="25" y="195" class="text-code lore-label">THE LORE:</text>
  <text x="110" y="195" class="text-code lore-flow">Creative Lab  ➔  Crab  ➔  Crap  ➔  Crêpe 🥞</text>

  <text x="25" y="222" class="text-code prompt" font-size="12">STATUS: Building useful software with questionable ideas<tspan class="cursor" dx="4">█</tspan></text>
</svg>